# EMVY Audit Agent — Cloudflare Worker + Durable Object
# Hosts the AuditAgent (DO) that backs the audit chatbot. Frontend on Vercel
# proxies chat messages to this Worker. See plan: ~/Claude Vault/...

name = "emvy-audit-agent"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Durable Object — one per lead session
[[durable_objects.bindings]]
name = "AUDIT_AGENT"
class_name = "AuditAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuditAgent"]

# Vars (non-secret) — set via `wrangler secret put` or in dashboard
[vars]
SUPABASE_URL = "https://rrjktvvnzjzlfquaghut.supabase.co"
# MINIMAX_API_KEY — secret, set with `wrangler secret put MINIMAX_API_KEY`
# SUPABASE_ANON_KEY — secret, set with `wrangler secret put SUPABASE_ANON_KEY`
# VERCEL_REPORT_URL — e.g. https://emvy-audit-chatbot.vercel.app/api/report
